<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SudoQuest – دليل ومسار إدارة الخوادم التفاعلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Host+Grotesk:ital,wght@0,300..800;1,300..800&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script>
(function() {
  const stored = localStorage.getItem("sa_theme");
  const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  const theme = stored || (prefersDark ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", theme);
})();
</script>
<style>
:root {
  /* Warm Parchment Palette */
  --bg: #fbf4ea;
  --card: #f2ebe2;
  --surface-inset: #e8e0d5;
  --text: #000000;
  --text-sec: #393939;
  --muted: #525151;
  --line: #dcd5cc;
  --primary: #7a1f33;
  --primary-hover: #5e1827;
  --primary-text: #fcfcfd;
  --ok: #115e3b;
  --okbg: #dcf2e6;
  --bad: #9e1c1c;
  --badbg: #f9e1e1;
  --gold: #b3821a;

  /* Inverse Ground / Boss Banner */
  --boss-bg: #141314;
  --boss-surface: #1e1c1e;
  --boss-text: #fcfcfd;
  --boss-line: #332f33;

  /* Typography */
  --font-serif: "EB Garamond", "Tajawal", Georgia, serif;
  --font-sans: "Host Grotesk", "Tajawal", system-ui, -apple-system, sans-serif;
  --font-ar: "Tajawal", "Host Grotesk", system-ui, -apple-system, sans-serif;
  --font-code: ui-monospace, "SF Mono", "Cascadia Code", "Fira Code", Menlo, Consolas, monospace;

  /* Geometric rules */
  --radius: 8px;
  --sh: 0 1px 3px rgba(0, 0, 0, 0.05);
  --sh-hover: 0 4px 14px rgba(0, 0, 0, 0.08);

  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

[data-theme="dark"] {
  --bg: #141314;
  --card: #1e1c1e;
  --surface-inset: #262326;
  --text: #fcfcfd;
  --text-sec: #dcd5cc;
  --muted: #9e9a98;
  --line: #332f33;
  --primary: #942b42;
  --primary-hover: #ad3751;
  --primary-text: #fcfcfd;
  --ok: #5ef0b0;
  --okbg: #0d3a2c;
  --bad: #ff9d94;
  --badbg: #44201f;
  --gold: #e5a93b;
  --boss-bg: #0c0b0c;
  --boss-surface: #181618;
  --boss-text: #fcfcfd;
  --boss-line: #2b272b;
  --sh: 0 1px 3px rgba(0, 0, 0, 0.3);
  --sh-hover: 0 6px 18px rgba(0, 0, 0, 0.5);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141314;
    --card: #1e1c1e;
    --surface-inset: #262326;
    --text: #fcfcfd;
    --text-sec: #dcd5cc;
    --muted: #9e9a98;
    --line: #332f33;
    --primary: #942b42;
    --primary-hover: #ad3751;
    --primary-text: #fcfcfd;
    --ok: #5ef0b0;
    --okbg: #0d3a2c;
    --bad: #ff9d94;
    --badbg: #44201f;
    --gold: #e5a93b;
    --boss-bg: #0c0b0c;
    --boss-surface: #181618;
    --boss-text: #fcfcfd;
    --boss-line: #2b272b;
    --sh: 0 1px 3px rgba(0, 0, 0, 0.3);
    --sh-hover: 0 6px 18px rgba(0, 0, 0, 0.5);
  }
}

*, *::before, *::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  scroll-padding-top: env(safe-area-inset-top, 0px);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ar);
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background 0.2s ease, color 0.2s ease;
}

/* Suppress legacy sci-fi animations and glowing floating objects */
.bub, .rp, .fx {
  display: none !important;
}

/* Header */
header {
  background: var(--card);
  border-bottom: 1px solid var(--line);
  color: var(--text);
  padding: 24px 24px 22px;
  position: relative;
  z-index: 10;
  box-shadow: var(--sh);
}

.header-wrap {
  max-width: 1120px;
  margin: 0 auto;
}

.header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
}

.header-brand {
  display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
}

.header-brand h1 {
  margin: 0;
  font-family: var(--font-serif);
  font-size: clamp(28px, 4vw, 36px);
  font-weight: 700;
  color: var(--primary);
  letter-spacing: -0.5px;
  line-height: 1.1;
}

.header-badge {
  font-family: var(--font-ar);
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  background: var(--surface-inset);
  border: 1px solid var(--line);
  padding: 3px 10px;
  border-radius: var(--radius);
  letter-spacing: 0.2px;
}

.header-meta {
  display: flex;
  align-items: center;
  gap: 12px;
}

.chip {
  display: inline-flex;
  align-items: center;
  background: var(--surface-inset);
  border: 1px solid var(--line);
  color: var(--text-sec);
  padding: 7px 16px;
  border-radius: var(--radius);
  font-family: var(--font-ar);
  font-size: 13.5px;
  font-weight: 700;
  letter-spacing: 0.2px;
}

.theme-toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--card);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 7px 14px;
  border-radius: var(--radius);
  font-family: var(--font-ar);
  font-size: 13.5px;
  font-weight: 700;
  min-height: 38px;
  cursor: pointer;
  touch-action: manipulation;
  transition: all 0.2s ease;
}

.theme-toggle:hover {
  background: var(--surface-inset);
  border-color: var(--primary);
  color: var(--primary);
}

.theme-toggle:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

.theme-toggle .icon-sun {
  display: none;
}

.theme-toggle .icon-moon {
  display: block;
}

[data-theme="dark"] .theme-toggle .icon-sun {
  display: block;
}

[data-theme="dark"] .theme-toggle .icon-moon {
  display: none;
}

header p {
  margin: 10px 0 0;
  font-family: var(--font-ar);
  font-size: 15px;
  color: var(--muted);
  line-height: 1.5;
}

/* Main Container */
main {
  max-width: 1120px;
  margin: 0 auto;
  padding: 32px 24px 64px;
  position: relative;
  z-index: 1;
}

/* Lectures Grid */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
  gap: 20px;
}

.lec {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 0;
  overflow: hidden;
  cursor: pointer;
  text-align: right;
  font: inherit;
  color: inherit;
  min-height: 48px;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  box-shadow: var(--sh);
  transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
}

.lec:hover,
.lec:focus-visible {
  border-color: var(--primary);
  box-shadow: var(--sh-hover);
  outline: none;
  transform: translateY(-2px);
}

.lec:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

.lec > .art {
  flex: 0 0 100%;
  height: 112px;
  color: var(--primary);
  background: var(--surface-inset);
  border-bottom: 1px solid var(--line);
  display: grid;
  place-items: center;
  margin-bottom: 14px;
  transition: background 0.2s ease, color 0.2s ease;
}

.art svg {
  height: 74%;
  width: auto;
  max-width: 88%;
}

.lec > .ring {
  margin: 0 0 16px;
  margin-inline-start: 16px;
}

.ring {
  flex: none;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  position: relative;
  background: conic-gradient(var(--primary) calc(var(--p, 0) * 1%), var(--line) 0);
  transition: background 0.6s ease;
}

.ring .badge {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--card);
  border: 1px solid var(--line);
  color: var(--primary);
  display: grid;
  place-items: center;
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: 16px;
  box-shadow: none;
}

.lec > div:last-child {
  padding: 0 0 16px;
  padding-inline-end: 16px;
  padding-inline-start: 12px;
  min-width: 0;
  flex: 1;
}

.lec b {
  display: block;
  font-family: var(--font-ar);
  font-size: 17.5px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.35;
}

.lec span {
  display: block;
  font-family: var(--font-sans);
  font-size: 13.5px;
  font-weight: 500;
  color: var(--muted);
  direction: ltr;
  text-align: right;
  margin-top: 3px;
  overflow-wrap: anywhere;
}

.lec small {
  display: block;
  margin-top: 8px;
  color: var(--text-sec);
  font-family: var(--font-ar);
  font-size: 13px;
  font-weight: 600;
}

.mini {
  display: block;
  height: 4px;
  background: var(--line);
  border-radius: 4px;
  margin-top: 8px;
  overflow: hidden;
}

.mini b {
  display: block;
  height: 100%;
  background: var(--primary) !important;
  border-radius: 4px;
  transition: width 0.4s ease;
}

/* Mixed Challenge Card (.boss) */
.boss {
  grid-column: 1 / -1;
  background: var(--boss-bg);
  border-color: var(--boss-line);
  color: var(--boss-text);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
}

.boss:hover,
.boss:focus-visible {
  border-color: var(--gold);
  box-shadow: 0 6px 22px rgba(0, 0, 0, 0.45);
  transform: translateY(-2px);
}

.boss:focus-visible {
  outline: 2px solid var(--gold);
}

.boss .art {
  background: var(--boss-surface);
  border-bottom: 1px solid var(--boss-line);
  color: var(--gold);
}

.boss .ring {
  background: conic-gradient(var(--gold) calc(var(--p, 100) * 1%), var(--boss-line) 0);
}

.boss .ring .badge {
  background: var(--boss-surface);
  color: var(--gold);
  border-color: var(--boss-line);
}

.boss b {
  color: var(--boss-text);
  font-family: var(--font-serif);
  font-size: 20px;
  letter-spacing: -0.2px;
}

.boss span {
  color: #dcd5cc;
  font-family: var(--font-sans);
  font-size: 14px;
}

.boss small {
  color: var(--gold);
  font-weight: 700;
}

.boss .mini b {
  background: var(--gold) !important;
}

/* Active Quiz / Flashcard View (.q) */
.bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.tag {
  background: var(--primary);
  color: var(--primary-text);
  border-radius: var(--radius);
  padding: 6px 14px;
  font-family: var(--font-ar);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.2px;
}

.link {
  background: var(--card);
  border: 1px solid var(--line);
  color: var(--text-sec);
  border-radius: var(--radius);
  font-family: var(--font-ar);
  font-weight: 700;
  font-size: 14px;
  padding: 6px 14px;
  cursor: pointer;
  transition: all 0.2s ease;
  min-height: 38px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  touch-action: manipulation;
}

.link:hover,
.link:focus-visible {
  border-color: var(--primary);
  color: var(--primary);
  background: var(--surface-inset);
  outline: none;
}

.link:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

.mid {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.qr {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  position: relative;
  isolation: isolate;
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: 13px;
  background: conic-gradient(var(--primary) calc(var(--p, 0) * 1%), var(--line) 0);
  transition: background 0.6s ease;
}

.qr::before {
  content: "";
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  background: var(--card);
  z-index: -1;
}

.qr span {
  color: var(--text);
}

.qr.er {
  background: conic-gradient(var(--bad) calc(var(--p, 0) * 1%), var(--line) 0);
}

.qr.er span {
  color: var(--bad);
  font-weight: 700;
}

.sc {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 4px 12px;
  font-family: var(--font-ar);
  font-weight: 700;
  font-size: 13px;
  color: var(--text);
}

.sc.fire {
  background: #fff8f0;
  border-color: #e5a93b;
  color: #9c5c06;
}

[data-theme="dark"] .sc.fire {
  background: #2b1d0d;
  border-color: #a15d07;
  color: #f5b759;
}

.prog {
  height: 6px;
  background: var(--line);
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 20px;
}

.prog i {
  display: block;
  height: 100%;
  background: var(--primary);
  border-radius: 4px;
  transition: width 0.35s ease;
}

.q {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 30px 26px;
  box-shadow: var(--sh);
}

.q .kind {
  font-family: var(--font-ar);
  font-size: 13.5px;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 12px;
}

.q h2 {
  margin: 0 0 22px;
  font-family: var(--font-sans);
  font-size: 20px;
  direction: ltr;
  text-align: left;
  line-height: 1.5;
  font-weight: 700;
  color: var(--text);
  overflow-wrap: anywhere;
}

#opts {
  counter-reset: o;
}

.opt {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  direction: ltr;
  text-align: left;
  font-family: var(--font-sans);
  font-size: 16px;
  font-weight: 500;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px 18px;
  margin-bottom: 12px;
  min-height: 48px;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  overflow-wrap: anywhere;
  transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}

.opt::before {
  counter-increment: o;
  content: counter(o, upper-alpha);
  flex: none;
  width: 28px;
  height: 28px;
  border-radius: 6px;
  display: grid;
  place-items: center;
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: 13px;
  background: var(--surface-inset);
  color: var(--text-sec);
  border: 1px solid var(--line);
  transition: all 0.15s ease;
}

.opt:hover:not(:disabled) {
  background: var(--card);
  border-color: var(--primary);
  color: var(--text);
}

.opt:hover:not(:disabled)::before {
  background: var(--primary);
  color: var(--primary-text);
  border-color: var(--primary);
}

.opt:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

.opt:disabled {
  cursor: default;
}

.opt.ok {
  background: var(--okbg) !important;
  border-color: var(--ok) !important;
  color: var(--ok) !important;
  font-weight: 700;
}

.opt.ok::before {
  content: "✓";
  background: var(--ok) !important;
  color: #fff !important;
  border-color: var(--ok) !important;
}

.opt.bad {
  background: var(--badbg) !important;
  border-color: var(--bad) !important;
  color: var(--bad) !important;
  font-weight: 700;
}

.opt.bad::before {
  content: "✕";
  background: var(--bad) !important;
  color: #fff !important;
  border-color: var(--bad) !important;
}

.tf {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.tf .opt {
  justify-content: center;
  text-align: center;
  margin: 0;
  font-weight: 700;
  font-size: 16.5px;
}

.tf .opt::before {
  display: none;
}

.fb {
  margin-top: 18px;
  padding: 14px 18px;
  border-radius: var(--radius);
  font-family: var(--font-ar);
  font-weight: 700;
  font-size: 15px;
  border: 1px solid transparent;
}

.fb.ok {
  background: var(--okbg);
  color: var(--ok);
  border-color: var(--ok);
}

.fb.bad {
  background: var(--badbg);
  color: var(--bad);
  border-color: var(--bad);
}

.fb em {
  display: block;
  font-style: normal;
  font-family: var(--font-sans);
  font-weight: 600;
  direction: ltr;
  text-align: left;
  margin-top: 6px;
  font-size: 14.5px;
  opacity: 0.95;
}

#ans-box {
  background: var(--card) !important;
  border: 1px solid var(--line) !important;
  border-inline-start: 4px solid var(--primary) !important;
  border-inline-end: 1px solid var(--line) !important;
  color: var(--text) !important;
  border-radius: var(--radius) !important;
  font-family: var(--font-sans) !important;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-top: 18px;
  background: var(--primary);
  color: var(--primary-text);
  border: 1px solid var(--primary);
  border-radius: var(--radius);
  font-family: var(--font-ar);
  font-weight: 700;
  font-size: 16px;
  padding: 12px 28px;
  min-height: 48px;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
}

.btn:hover {
  background: var(--primary-hover);
  border-color: var(--primary-hover);
}

.btn:active {
  transform: translateY(1px);
}

.btn:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

.btn.alt {
  background: var(--surface-inset);
  color: var(--text);
  border-color: var(--line);
}

.btn.alt:hover {
  background: var(--card);
  border-color: var(--text-sec);
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* Results & Review View (.res) */
.res {
  text-align: center;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 38px 24px;
  box-shadow: var(--sh);
  max-width: 860px;
  margin: 0 auto;
}

.res > div:first-child {
  font-family: var(--font-ar);
  font-size: 17px;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 6px;
}

.rank {
  font-family: var(--font-ar);
  font-size: 24px;
  font-weight: 700;
  color: var(--text);
  margin: 12px 0 20px;
}

.rank b {
  font-family: var(--font-serif);
  font-size: 32px;
  color: var(--primary);
  margin: 0 6px;
}

.rank small {
  display: block;
  font-family: var(--font-ar);
  font-size: 14.5px;
  font-weight: 600;
  color: var(--muted);
  margin-top: 4px;
}

.rings {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: clamp(20px, 6vw, 44px);
  margin: 24px 0 20px;
  flex-wrap: wrap;
}

.rings figure {
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.rings figcaption {
  font-family: var(--font-ar);
  font-weight: 700;
  font-size: 14px;
  color: var(--text-sec);
  margin-top: 10px;
}

.res .n {
  width: clamp(100px, 28vw, 128px);
  height: clamp(100px, 28vw, 128px);
  border-radius: 50%;
  margin: 0 auto;
  display: grid;
  place-items: center;
  font-family: var(--font-serif);
  font-size: clamp(26px, 6vw, 36px);
  font-weight: 700;
  color: var(--ok);
  position: relative;
  isolation: isolate;
  background: conic-gradient(var(--ok) calc(var(--p, 0) * 1%), var(--line) 0);
  transition: background 0.8s ease;
}

.res .n::before {
  content: "";
  position: absolute;
  inset: 6px;
  border-radius: 50%;
  background: var(--card);
  z-index: -1;
}

.res .n2 {
  background: conic-gradient(var(--bad) calc(var(--p, 0) * 1%), var(--line) 0) !important;
  color: var(--bad) !important;
}

.res p {
  font-family: var(--font-ar);
  font-size: 17px;
  font-weight: 600;
  color: var(--text);
  margin: 16px 0 24px;
  line-height: 1.5;
}

.rev {
  margin-top: 32px;
  text-align: right;
  border-top: 1px solid var(--line);
  padding-top: 24px;
}

.rev div {
  direction: ltr;
  text-align: left;
  padding: 12px 16px;
  border-radius: var(--radius);
  margin-bottom: 10px;
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.5;
  border: 1px solid transparent;
  overflow-wrap: anywhere;
}

.rev .ok {
  background: var(--okbg);
  color: var(--ok);
  border-color: var(--ok);
}

.rev .bad {
  background: var(--badbg);
  color: var(--bad);
  border-color: var(--bad);
}

/* Mobile & Accessibility */
@media (max-width: 640px) {
  header {
    padding: 20px 16px 18px;
  }
  .header-row {
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
  }
  .header-meta {
    width: 100%;
    justify-content: space-between;
  }
  main {
    padding: 20px 16px 48px;
  }
  .grid {
    grid-template-columns: 1fr;
    gap: 14px;
  }
  .q {
    padding: 20px 16px;
  }
  .q h2 {
    font-size: 18px;
  }
  .opt {
    padding: 11px 14px;
    font-size: 15px;
  }
  .tf {
    grid-template-columns: 1fr;
  }
  .btn {
    width: 100%;
  }
  .res .btn {
    width: 100%;
    margin: 6px 0;
  }
  .lec > .art {
    height: 96px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}


/* Question Number Strip */
.q-strip-wrap {
  margin-bottom: 20px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px 14px 10px;
  box-shadow: var(--sh);
}

.q-strip-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  font-family: var(--font-ar);
  font-size: 13.5px;
  font-weight: 700;
  color: var(--muted);
  flex-wrap: wrap;
  gap: 8px;
}

.q-strip-legend {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  font-size: 12px;
  font-weight: 600;
}

.q-strip-legend-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--text-sec);
}

.q-strip-legend-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  display: inline-block;
}

.q-strip {
  display: flex;
  align-items: center;
  gap: 7px;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 4px 2px 8px;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}

.q-strip::-webkit-scrollbar {
  height: 6px;
}

.q-strip::-webkit-scrollbar-track {
  background: var(--surface-inset);
  border-radius: 3px;
}

.q-strip::-webkit-scrollbar-thumb {
  background: var(--line);
  border-radius: 3px;
}

.q-strip::-webkit-scrollbar-thumb:hover {
  background: var(--muted);
}

.q-pill {
  flex: 0 0 36px;
  width: 36px;
  height: 36px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  border: 1px solid var(--line);
  background: var(--surface-inset);
  color: var(--text-sec);
  touch-action: manipulation;
  transition: all 0.15s ease;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  padding: 0;
}

.q-pill:hover:not(.active) {
  border-color: var(--primary);
  color: var(--primary);
  background: var(--card);
}

.q-pill:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

/* Current active question */
.q-pill.active {
  background: #7a1f33 !important;
  color: #fcfcfd !important;
  border-color: #7a1f33 !important;
  box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px #7a1f33;
  transform: translateY(-1px) scale(1.05);
  font-weight: 800;
  z-index: 2;
}

[data-theme="dark"] .q-pill.active {
  background: #942b42 !important;
  border-color: #942b42 !important;
  box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px #942b42;
}

/* Answered correctly */
.q-pill.ok {
  background: var(--okbg);
  color: var(--ok);
  border-color: var(--ok);
}

/* Answered incorrectly */
.q-pill.bad {
  background: var(--badbg);
  color: var(--bad);
  border-color: var(--bad);
}

/* Peeked / Revealed */
.q-pill.peeked {
  background: var(--surface-inset);
  color: var(--gold);
  border-color: var(--gold);
  border-style: dashed;
}

/* Card Header with Peek Button */
.q-card-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  gap: 10px;
  flex-wrap: wrap;
}

.btn-peek {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--surface-inset);
  border: 1px dashed var(--line);
  color: var(--text-sec);
  border-radius: var(--radius);
  font-family: var(--font-ar);
  font-weight: 700;
  font-size: 13px;
  padding: 5px 12px;
  cursor: pointer;
  touch-action: manipulation;
  transition: all 0.2s ease;
  min-height: 32px;
}

.btn-peek:hover:not(:disabled) {
  border-color: var(--primary);
  color: var(--primary);
  background: var(--card);
}

.btn-peek:disabled {
  opacity: 0.55;
  cursor: default;
}

/* Bottom Persistent Navigation */
.q-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 24px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
  flex-wrap: wrap;
}

.q-nav .btn {
  margin-top: 0;
  flex: 1 1 140px;
  min-height: 46px;
  padding: 10px 20px;
  font-size: 15.5px;
}

.q-nav-info {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-ar);
  font-weight: 700;
  font-size: 14px;
  color: var(--muted);
  padding: 0 6px;
}

@media (max-width: 640px) {
  .q-nav {
    flex-direction: column-reverse;
    gap: 10px;
  }
  .q-nav .btn {
    width: 100%;
    flex: none;
  }
  .q-nav-info {
    order: -1;
    margin-bottom: 4px;
  }
}

</style>

const E=(q,a)=>({q,a});
L.push({
  n: "المقالي",
  s: "Short Answers & Explanations",
  essay: true,
  q: [
    E("Compare Linux Server and Windows Server across four key criteria (Cost, Stability, Performance, and Package Management).", "1. Cost: Linux is open-source and free (no licensing fees); Windows requires expensive server licenses and Client Access Licenses (CALs).\n2. Stability & Reliability: Linux offers rock-solid uptime and rarely requires reboots (even during kernel/service updates); Windows frequently demands system restarts after updates.\n3. Performance & Efficiency: Linux is lightweight, highly optimized for headless CLI use, and consumes minimal CPU/RAM; Windows has higher resource overhead due to mandatory GUI subsystems.\n4. Package Management: Linux relies on centralized, scriptable package repositories (e.g., apt, yum, dnf); Windows traditionally depends on manual executable installers."),
    E("List the core responsibilities of a Server Administrator.", "1. Installation & Configuration of server hardware, operating systems, and services.\n2. Performance Monitoring (CPU, RAM, disk I/O, network) and troubleshooting bottlenecks.\n3. Backup and Disaster Recovery planning, automation, and regular restoration testing.\n4. Patching & Security Updates for operating systems and critical applications.\n5. User and Access Management (creating accounts, groups, permissions, and directory integration).\n6. Storage and File System Management (RAID arrays, LVM volumes, disk quotas)."),
    E("What are the main advantages of using LVM (Logical Volume Manager) over traditional disk partitioning?", "1. Flexible Capacity & Resizable Volumes: Dynamically expand or shrink logical volumes online without unmounting or reformatting disks.\n2. Storage Pooling (Volume Groups): Aggregate multiple physical disks/partitions into a single storage pool (VG).\n3. Online Data Migration: Move live data between physical volumes seamlessly without system downtime.\n4. Snapshots & Thin Provisioning: Create instant point-in-time volume snapshots for safe backups, and allocate virtual storage space on demand."),
    E("What are the essential Linux commands used to inspect LVM components, swap space, and disk usage?", "• LVM Inspection:\n  - sudo pvs: Inspect Physical Volumes (size, free space, volume group assignment).\n  - sudo vgs: Inspect Volume Groups (total size, free space, number of PVs and LVs).\n  - sudo lvs: Inspect Logical Volumes (size, volume group, path, snapshot status).\n• Disk Usage & Block Devices:\n  - df -h: Show human-readable disk space usage on mounted filesystems.\n  - lsblk: Display block devices and partition hierarchy in a tree format.\n• Swap Status:\n  - sudo swapon --show (or free -h): Display active swap partitions/files and memory utilization."),
    E("Explain the two main phases of network communication in Clonezilla Server during PXE boot and deployment.", "1. Boot Phase (PXE Boot):\n   • Client requests network configuration via DHCP -> DHCP server assigns a temporary IP and specifies the TFTP boot server IP.\n   • Client requests bootloader from TFTP -> TFTP serves pxelinux.0, kernel, and initrd.img to boot the client completely into RAM.\n2. Operation Phase (Cloning / Restoration):\n   • Client mounts the Clonezilla Live environment and disk image storage repository from the NFS server.\n   • Clonezilla executes the imaging script, reading from or writing to the server disk image storage over NFS."),
    E("What are the primary purposes of creating disk images with Clonezilla, and what are the benefits of centralizing them on a server?", "• Primary Purposes:\n  1. Rapid Disaster Recovery: Fast bare-metal restoration of crashed systems without reinstalling OS and apps.\n  2. Mass Deployment: Deploying identical standardized operating systems across multiple machines simultaneously.\n  3. Hardware Migration: Upgrading or moving systems seamlessly between drives or physical machines.\n• Centralized Server Benefits:\n  - Automated & Scheduled Backups: Regular unattended image creation.\n  - Enhanced Security & Version Control: Managed access control permissions on images.\n  - Storage Redundancy: Storing images on fault-tolerant server RAID arrays.\n  - High Speed Mass Rollouts: Rapid multicast deployment over the local network via PXE."),
    E("[Scenario] In a Clonezilla Server setup, clients can PXE boot and see the menu, but cannot access stored disk images on the server. Network connectivity is normal. Which service is misconfigured, and what are its two core roles?", "• Misconfigured Service: NFS (Network File System).\n• Two Core Roles in Clonezilla:\n  1. Shares and exports the central disk image storage directory across the network so PXE clients can read/write raw image files.\n  2. Serves and hosts the Clonezilla Live filesystem root and manages network file access permissions."),
    E("[Scenario] An organization wants to deploy an identical OS setup to 30 new PCs simultaneously without manual installation, ensuring only authorized admins can restore images. What technologies and policies solve this?", "• Technologies: Clonezilla Server Edition (DRBL) configured in Multicast mode over PXE network boot (supported by DHCP, TFTP, and NFS), allowing a single broadcast stream to clone all 30 machines in parallel.\n• Security Policies: Storing images centrally on Ubuntu Server with strict access permissions (limiting restore rights to administrators only), utilizing RAID storage for redundancy, and establishing snapshot policies."),
    E("[Scenario] Quick Decision Guide: Match the right technology to each requirement (RAID 6, XFS, Swap, NIC Bonding).", "• Surviving 2 simultaneous disk failures in a large array: RAID 6 (uses double distributed parity blocks).\n• High-throughput transactional database needing an optimal Linux filesystem: XFS (engineered for large files and high parallel I/O throughput).\n• Server running out of physical RAM during peak workloads: Swap space (pages out inactive memory pages to disk and enables system hibernation).\n• Preventing network downtime if a network cable or NIC fails: NIC Bonding in active-backup mode (mode 1)."),
    E("Summarize the three DRBL setup commands used during Clonezilla Server installation and what each does.", "• sudo drblsrv -i: Installs DRBL core packages (drbl, nfs-kernel-server, tftp-hpa) and configures directory trees.\n• sudo drblsrv -s: Sets up DRBL system configuration templates under /etc/drbl/ for DHCP, DNS, TFTP, and NFS.\n• sudo drblpush -i: Probes active network interfaces, generates the client PXE boot environment, and starts/activates the DRBL server services."),
    E("[Scenario] If DNS lookups fail even after configuring /etc/bind/named.conf.options, what step must be rechecked, and what does 'sudo resolvconf -u' do?", "• Step to Recheck: Step 6 — Persistent DNS configuration (verify /etc/resolvconf/resolv.conf.d/head and confirm the named / BIND9 service is enabled and running).\n• sudo resolvconf -u: Regenerates and dynamically updates the system DNS resolver file (/etc/resolv.conf) from the resolvconf configuration files."),
    E("[Scenario] Why does Clonezilla require the client machine to use DHCP when booting via PXE?", "Because during a PXE network boot, the client has no operating system or network configuration loaded on its local hard drive. It relies entirely on DHCP to dynamically obtain a temporary IP address, subnet mask, gateway, and the TFTP boot server IP address to fetch bootloaders and kernel images."),
    E("[Scenario] Why does Clonezilla separate 'savedisk' and 'restoredisk' into distinct commands instead of a single tool?", "To prevent catastrophic accidental data loss. 'savedisk' is a read-only capture operation from client to server (captures the disk non-destructively), whereas 'restoredisk' is a destructive write operation that completely wipes the client's destination drive. Separating them prevents administrators from unintentionally overwriting production disks."),
    E("What is the purpose of 'sudo smbpasswd -a <username>', and how do you verify a Samba share from Windows and Linux clients?", "• smbpasswd -a <username>: Adds an existing local Linux user to Samba's independent credentials database (passdb.tdb) and sets their SMB password.\n• Windows Verification: Press Win+R, type \\\\<ubuntu_server_ip> (e.g., \\\\192.168.221.10), and enter login credentials.\n• Linux Verification: Run 'smbclient //<ubuntu_server_ip>/<share_name> -U <username>' in terminal."),
    E("[Scenario] Analyze the relationship between Samba SMB ports (139 & 445) and firewall security. What risks arise if left open to the internet?", "• Ports 139 (NetBIOS Session Service) and 445 (direct SMB over TCP) expose core file and printer sharing protocols.\n• Internet Risk: If left exposed to the public internet, they become primary attack vectors for brute-force attacks, unauthenticated directory browsing, and lateral worm/ransomware propagation (such as WannaCry / EternalBlue). UFW firewalls must always restrict ports 139 and 445 to authorized local subnets only."),
    E("What are the roles of the three primary Samba daemons: smbd, nmbd, and winbindd?", "• smbd: Manages file and print sharing services, handles SMB/CIFS protocol negotiations, and validates user authentication and access permissions.\n• nmbd: Handles NetBIOS name resolution, facilitates NetBIOS-over-IP, and enables local network browsing (Windows Network Neighborhood).\n• winbindd: Integrates Linux systems into a Windows Active Directory domain, allowing domain users and groups to authenticate on the Linux server."),
    E("Explain the difference between Hard Links and Soft (Symbolic) Links in Linux file systems.", "• Hard Link: An additional directory entry pointing directly to the file's original inode on the same filesystem. Deleting the original file keeps the data intact as long as a hard link exists. Cannot span across different filesystems or link directories.\n• Soft (Symbolic) Link: A small pointer file containing the path string to another target file or directory. Can cross filesystem boundaries and link directories. If the target file is deleted or moved, the symbolic link breaks (dangling link)."),
    E("Compare the seven RAID levels (0, 1, 5, 6, 10, 50, 60) regarding minimum disks, fault tolerance, and primary trade-offs.", "• RAID 0: Min 2 disks, Striping, 0 fault tolerance, highest speed, total capacity 100%.\n• RAID 1: Min 2 disks, Mirroring, survives 1 disk failure per pair, 50% capacity, high read speed, write overhead.\n• RAID 5: Min 3 disks, Distributed single parity, survives 1 disk failure, capacity (N-1), parity write penalty.\n• RAID 6: Min 4 disks, Distributed dual parity, survives 2 disk failures, capacity (N-2), excellent for large disk arrays (8+ disks).\n• RAID 10 (1+0): Min 4 disks, Mirrored stripes, survives 1 disk failure per mirror pair, 50% capacity, high performance & redundancy.\n• RAID 50/60: Min 6/8 disks, Striped RAID 5/6 sets, balances high capacity with fault tolerance for enterprise arrays."),
    E("What are the key advantages of using RAID in server environments?", "• Higher Performance: Striping (RAID 0, 5, 6, 10) allows parallel read and write operations across multiple drive heads simultaneously.\n• Data Redundancy & Fault Tolerance: Mirroring and parity protect critical enterprise data from drive hardware failures without service disruption.\n• Capacity Aggregation: Combines multiple physical disks into a single large logical storage volume.\n• Extended Drive Lifespan: Distributes read/write I/O workloads evenly across the array, preventing premature drive burnout."),
    E("[Scenario] System Administration Efficiency: An administrator spends hours manually downloading installers and updating software across Windows servers. How does Linux centralized package management solve this problem?", "• Linux Solution: Centralized Package Management (e.g., APT on Debian/Ubuntu, DNF/YUM on RHEL/Fedora).\n• Administrative Benefits:\n1. Automation & Scripting: A single command (e.g., 'sudo apt update && sudo apt upgrade -y') updates all operating system components and installed services unattended.\n2. Security & Integrity: Packages are cryptographically signed with GPG keys and fetched over authenticated channels from curated repositories, avoiding untrusted third-party executable installers.\n3. Automatic Dependency Resolution: Automatically identifies, downloads, and configures all prerequisite libraries, eliminating broken dependencies."),
    E("What are the primary operational benefits of NIC bonding (network teaming) in enterprise servers?", "1. Redundancy & High Availability: If one physical network adapter, port, or cable fails, traffic instantly switches to the backup link (e.g., active-backup / Mode 1) without dropping active connections or user sessions.\n2. Bandwidth Aggregation (Load Balancing): Combines the bandwidth of multiple physical NICs into one logical high-throughput pipe (e.g., Mode 4 / IEEE 802.3ad LACP), eliminating network interface bottlenecks for busy file and database servers."),
    E("Explain the primary roles and typical contents of the Linux /var directory.", "1. System & Service Logs (/var/log): Stores persistent logging information (e.g., /var/log/syslog, /var/log/auth.log, /var/log/samba/) crucial for auditing, monitoring, and debugging.\n2. Dynamic Application & Database Data (/var/lib): Houses runtime databases and state files (e.g., /var/lib/mysql, /var/lib/ldap).\n3. Web Server Content (/var/www): Default root directory for web files and virtual hosts.\n4. Spool & Mail Queues (/var/spool): Manages temporary queues for print jobs and outgoing mail daemons."),
    E("[Scenario] Storage Architecture Selection: An administrator is configuring storage for a high-transaction enterprise database server processing large streaming media logs and multi-gigabyte sequential database tables. Should they choose Ext4 or XFS, and why?", "• Recommended Filesystem: XFS.\n• Technical Justification:\n1. High-Throughput & Parallel I/O: XFS uses Allocation Groups that allow multiple CPU cores and threads to perform concurrent read/write allocations simultaneously without filesystem-wide locks.\n2. Massive File & Volume Scalability: XFS handles multi-terabyte files and very large filesystems with virtually no performance degradation.\n3. Ext4 Trade-Off: While Ext4 is reliable and ideal for general OS root partitions and small files, its centralized metadata allocation creates bottlenecks under heavy, concurrent, large-scale database operations."),
    E("[Scenario] Memory Management Strategy: During peak business hours, a server exhausts physical RAM, causing critical application crashes. How does configuring Swap space solve this issue without immediate hardware upgrades?", "• Solution: Configure Swap Space (Swap Partition or Swap File via 'mkswap' and 'swapon').\n• Protection Mechanism:\n1. Virtual Memory Paging: The Linux kernel continuously identifies idle, inactive memory pages and transfers them to swap on disk, freeing high-speed physical RAM for active processes.\n2. OOM Killer Prevention: Prevents the Linux Out-Of-Memory (OOM) killer from abruptly terminating essential database and application daemons when RAM reaches 100% capacity.\n3. Transient Spike Absorber: Absorbs unexpected memory allocation surges until administrator intervention or workload normalization."),
    E("What are the main advantages of a centralized Clonezilla Server (DRBL) setup compared to standalone USB cloning?", "1. Multicast Mass Deployment: Deploys disk images to dozens or hundreds of client machines simultaneously across the local network without multiplying network bandwidth or deployment time.\n2. Centralized Image Repository: System images are safely archived and maintained on the server (/home/partimag), eliminating the maintenance, loss, and physical updating of dozens of USB flash drives.\n3. Zero Client Pre-installation: Bare-metal client machines boot directly over the network via PXE into RAM without requiring an installed operating system or software on the client."),
    E("What is the function of the 'net-tools' package during Clonezilla Server installation and configuration?", "• Purpose of net-tools:\nInstalls foundational legacy networking utilities including 'ifconfig' (to inspect network interfaces and verify static IP/netmask bindings), 'netstat' (to audit active listening ports and established server sockets), 'route' (to inspect IP routing tables and default gateways), and 'arp' (to diagnose local hardware address mappings)."),
    E("Explain the role and tasks performed by the 'drblsrv -s' command during DRBL installation.", "• Role of 'drblsrv -s':\nPrepares the server's network boot environment by downloading and configuring the client kernel, initramfs, and DRBL client-side packages. It stages the required boot files without yet modifying system services (DHCP/NFS/TFTP) on the host server until 'drblpush -i' is subsequently executed."),
    E("Why is UFW (Uncomplicated Firewall) critical on the Clonezilla server, and which ports must be permitted?", "• Importance: UFW secures the server against unauthorized access while strictly permitting the specific network ports required for mass network deployment:\n• Permitted Ports:\n- DHCP: 67/udp (server), 68/udp (client)\n- TFTP: 69/udp (PXE boot file transfer)\n- DNS: 53/tcp & 53/udp (BIND domain resolution)\n- NFS: 2049/tcp & 2049/udp, plus rpcbind 111 (mounting image storage)\n- Samba: 139/tcp & 445/tcp (SMB file sharing)"),
    E("[Scenario] Practical Deployment Script: If you were to automate the 'Test the Setup' stage after Clonezilla Server installation, which commands would you include and why?", "• Script Commands:\n1. ping -c 3 192.168.221.10: Verifies local TCP/IP stack and interface reachability.\n2. ip addr show ens33: Confirms the static IP address and netmask are correctly configured in Netplan.\n3. systemctl is-active bind9 isc-dhcp-server tftpd-hpa nfs-kernel-server: Verifies that all four core deployment daemons are in the 'active (running)' state.\n4. sudo ufw status: Confirms the firewall is active and that required ports (53, 67, 69, 2049) are properly allowed.\n5. ls -la /home/partimag: Confirms the image repository directory exists with correct read/write permissions."),
    E("How does the client machine boot over the network using PXE in a Clonezilla deployment environment?", "1. Client BIOS/UEFI powers on and initializes the network interface with PXE enabled.\n2. DHCP Request: Client broadcasts a DHCP request; the Clonezilla DHCP server assigns an IP address and specifies the Next-Server (TFTP) IP and boot filename (pxelinux.0).\n3. TFTP Boot Transfer: Client downloads the bootloader (pxelinux.0), configuration menu, Linux kernel (vmlinuz), and initrd image into client RAM via TFTP.\n4. Clonezilla Live in RAM: The client boots the kernel entirely in RAM and mounts the Clonezilla image repository over NFS from the server to begin backup or restoration.")
  ]

function confetti(x, y, n) {
  const cs = ["#00FF9D", "#5ED6C1", "#23A095", "#1A2A4F", "#ffd166"];
  for (let i = 0; i < n; i++) {
    const d = document.createElement("i");
    d.className = "fx";
    d.style.background = cs[i % 5];
    document.body.appendChild(d);
    const a = Math.random() * 6.283, v = 80 + Math.random() * 170;
    d.animate([
      { transform: `translate(${x}px,${y}px) scale(1)`, opacity: 1 },
      { transform: `translate(${x + Math.cos(a) * v}px,${y + Math.sin(a) * v + 90}px) rotate(${Math.random() * 540}deg) scale(.4)`, opacity: 0 }
    ], { duration: 900 + Math.random() * 500, easing: "cubic-bezier(.2,.8,.3,1)" }).onfinish = () => d.remove();
  }
}

    return `<button class="lec" data-i="${i}" style="--ac:${acs[i] || "var(--primary)"};--d:${i * 80}ms">
      <div class="art">${ART[i] || ""}</div>
      <div class="ring" style="--p:${p}">
        <div class="badge">${icons[i] || (i + 1)}</div>
      </div>
      <div>
        <b>${l.n}</b>
        <span>${esc(l.s)}</span>
        <small>${l.q.length} سؤال${best[i] != null ? " · " + (l.essay ? "تمت مراجعتها" : "أفضل نتيجة " + best[i] + "/" + l.q.length) : ""}</small>
        <i class="mini"><b style="width:${p}%"></b></i>
      </div>
    </button>`;
  }).join("") + `
    <button class="lec boss" id="boss" style="--ac:#E8954F;--d:640ms">
      <div class="art">${ART[7]}</div>
      <div class="ring" style="--p:100"><div class="badge">🏆</div></div>
      <div>
        <b>التحدي الشامل ⚡</b>
        <span>Mixed Challenge</span>
        <small>20 سؤال عشوائي من كل المحاضرات</small>
      </div>
    </button>
  </div>`;
  
  app.querySelectorAll(".lec:not(.boss)").forEach(b => b.onclick = () => start(+b.dataset.i));
  document.getElementById("boss").onclick = () => {
    const pool = L.filter(l => !l.essay).flatMap(l => l.q).sort(() => Math.random() - .5).slice(0, 20);
    L.push({ n: "التحدي الشامل", s: "Mixed Challenge", q: pool });
    start(L.length - 1);
  };
  scrollTo(0, 0);
}

function start(i) {
  li = i;
  qi = 0;
  log = [];
  wq = [];
  userAnswers = {};
  show();
}

function renderStrip() {
  const n = L[li].q.length;
  let pills = "";
  for (let idx = 0; idx < n; idx++) {
    const isCur = (idx === qi);
    const ans = userAnswers[idx];
    let stateCls = "";
    if (isCur) {
      stateCls = "active";
    }
    if (ans && ans.answered) {
      if (ans.correct) stateCls += " ok";
      else if (ans.peeked) stateCls += " peeked";
      else stateCls += " bad";
    }
    pills += `<button type="button" class="q-pill ${stateCls.trim()}" data-qi="${idx}" title="السؤال ${idx + 1}" aria-label="السؤال ${idx + 1}">${idx + 1}</button>`;
  }
  return `<div class="q-strip-wrap">
    <div class="q-strip-header">
      <span>شريط الأسئلة (السؤال ${qi + 1} من ${n})</span>
      <div class="q-strip-legend">
        <span class="q-strip-legend-item"><i class="q-strip-legend-dot" style="background:#7a1f33"></i> الحالي</span>
        <span class="q-strip-legend-item"><i class="q-strip-legend-dot" style="background:var(--ok)"></i> صحيح</span>
        <span class="q-strip-legend-item"><i class="q-strip-legend-dot" style="background:var(--bad)"></i> خطأ</span>
      </div>
    </div>
    <div class="q-strip" id="q-strip" role="tablist">${pills}</div>
  </div>`;
}

function updateMidStats() {
  const mid = app.querySelector(".mid");
  if (!mid) return;
  const n = L[li].q.length;
  if (L[li].essay) {
    mid.innerHTML = `<div class="qr" style="--p:${((qi + 1) / n) * 100}"><span>${qi + 1}</span></div><span class="sc">📖 بطاقة ${qi + 1}/${n}</span>`;
    return;
  }
  const scoreVal = Object.values(userAnswers).filter(a => a && a.correct && !a.peeked).length;
  const errCount = Object.values(userAnswers).filter(a => a && a.answered && !a.correct).length;
  
  // consecutive correct streak
  let streak = 0;
  for (let idx = qi; idx >= 0; idx--) {
    const a = userAnswers[idx];
    if (a && a.correct && !a.peeked) streak++;
    else if (a && a.answered) break;
  }
  
  mid.innerHTML = `
    <div class="qr" style="--p:${((qi + 1) / n) * 100}"><span>${qi + 1}</span></div>
    <span class="sc">⭐ ${scoreVal}</span>
    ${errCount > 0 ? `<div class="qr er" title="أخطاء" style="--p:${(errCount / n) * 100}"><span>✕${errCount}</span></div>` : ""}
    ${streak >= 2 ? `<span class="sc fire">🔥 ${streak}</span>` : ""}
  `;
}

function show() {
  const l = L[li], q = l.q[qi], n = l.q.length;
  app.style.setProperty("--ac", acs[li] || "var(--primary)");

  if (l.essay) {
    const ans = userAnswers[qi];
    const isRevealed = ans && ans.revealed;
    app.innerHTML = `
      <div class="bar">
        <span class="tag">${l.n}</span>
        <div class="mid"></div>
        <button class="link" id="back">الرجوع للمحاضرات</button>
      </div>
      <div class="prog"><i style="width:${((qi + 1) / n) * 100}%"></i></div>
      ${renderStrip()}
      <div class="q">
        <div class="kind">سؤال مقالي ${qi + 1} من ${n} · كروت استذكار 💡</div>
        <h2 style="line-height:1.5;margin-bottom:18px;">${esc(q.q)}</h2>
        <button class="btn" id="show-ans" style="margin:8px 0 14px;width:100%;font-size:16px;">${isRevealed ? "🙈 إخفاء الإجابة" : "👁️ إظهار الإجابة النموذجية"}</button>
        <div id="ans-box" class="fb ok" style="display:${isRevealed ? "block" : "none"};margin:12px 0 20px;white-space:pre-wrap;text-align:left;direction:ltr;font-family:inherit;font-size:15px;line-height:1.6;border-right:none;border-left:4px solid var(--ac);padding:14px 16px;background:rgba(35,160,149,.08);">
          <strong style="display:block;margin-bottom:8px;color:var(--text);direction:rtl;text-align:right;font-size:14px;">الإجابة النموذجية:</strong>
          ${esc(q.a)}
        </div>
        <div class="q-nav">
          <button type="button" class="btn alt" id="btn-prev" ${qi === 0 ? "disabled" : ""}>→ السؤال السابق</button>
          <span class="q-nav-info">${qi + 1} / ${n}</span>
          <button type="button" class="btn" id="btn-next">${qi === n - 1 ? "إنهاء المراجعة 🎉" : "السؤال التالي ←"}</button>
        </div>
      </div>`;

    document.getElementById("back").onclick = home;
    const showBtn = document.getElementById("show-ans");
    const ansBox = document.getElementById("ans-box");
    showBtn.onclick = () => {
      const cur = ansBox.style.display === "block";
      ansBox.style.display = cur ? "none" : "block";
      showBtn.textContent = cur ? "👁️ إظهار الإجابة النموذجية" : "🙈 إخفاء الإجابة";
      userAnswers[qi] = { answered: true, revealed: !cur, correct: true };
      const stripPill = document.querySelector(`.q-pill[data-qi="${qi}"]`);
      if (stripPill) {
        stripPill.className = `q-pill active ${!cur ? "ok" : ""}`;
      }
    };
    document.getElementById("btn-prev").onclick = navPrev;
    document.getElementById("btn-next").onclick = () => {
      if (qi < n - 1) { qi++; show(); }
      else finishEssay();
    };
    document.querySelectorAll(".q-pill").forEach(pill => {
      pill.onclick = () => {
        const target = +pill.dataset.qi;
        if (target !== qi) { qi = target; show(); }
      };
    });
    updateMidStats();
    const act = document.querySelector(".q-pill.active");
    if (act) act.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
    return;
  }

  // Regular multiple choice / true-false question
  const ans = userAnswers[qi];
  const isAnswered = ans && ans.answered;

  app.innerHTML = `
    <div class="bar">
      <span class="tag">${l.n}</span>
      <div class="mid"></div>
      <button class="link" id="back">الرجوع للمحاضرات</button>
    </div>
    <div class="prog"><i style="width:${((qi + 1) / n) * 100}%"></i></div>
    ${renderStrip()}
    <div class="q">
      <div class="q-card-head">
        <div class="kind">سؤال ${qi + 1} من ${n} · ${q.tf ? "صح أم غلط" : "اختيار من متعدد"}</div>
        <button type="button" class="btn-peek" id="btn-peek" ${isAnswered ? "disabled" : ""}>
          ${isAnswered ? (ans.peeked ? "👁️ تم كشف الإجابة" : "✓ تم إرسال الإجابة") : "👁️ إظهار الإجابة"}
        </button>
      </div>
      <h2>${esc(q.q)}</h2>
      <div class="${q.tf ? "tf" : ""}" id="opts">
        ${q.o.map((o, k) => `<button type="button" class="opt" data-k="${k}">${esc(o)}</button>`).join("")}
      </div>
      <div id="fb"></div>
      <div class="q-nav">
        <button type="button" class="btn alt" id="btn-prev" ${qi === 0 ? "disabled" : ""}>→ السؤال السابق</button>
        <span class="q-nav-info">${qi + 1} / ${n}</span>
        <button type="button" class="btn" id="btn-next">${qi === n - 1 ? "إنهاء الاختبار 🎉" : "السؤال التالي ←"}</button>
      </div>
    </div>`;

  document.getElementById("back").onclick = home;
  document.getElementById("btn-prev").onclick = navPrev;
  document.getElementById("btn-next").onclick = navNext;

  document.querySelectorAll(".q-pill").forEach(pill => {
    pill.onclick = () => {
      const target = +pill.dataset.qi;
      if (target !== qi) { qi = target; show(); }
    };
  });

  const bs = document.querySelectorAll(".opt");
  if (isAnswered) {
    bs.forEach((b, k) => {
      b.disabled = true;
      if (k === q.a) b.classList.add("ok");
      else if (ans.selected !== null && k === ans.selected) b.classList.add("bad");
    });
    const fb = document.getElementById("fb");
    if (ans.correct) {
      fb.innerHTML = `<div class="fb ok" role="status">✓ إجابتك صح</div>`;
    } else if (ans.peeked) {
      fb.innerHTML = `<div class="fb ok" role="status">👁️ تم كشف الإجابة الصحيحة: <em>${esc(q.o[q.a])}</em></div>`;
    } else {
      fb.innerHTML = `<div class="fb bad" role="status">✗ إجابتك غلط<em>Correct answer: ${esc(q.o[q.a])}</em></div>`;
    }
  } else {
    bs.forEach(b => b.onclick = () => pick(+b.dataset.k));
    const btnPeek = document.getElementById("btn-peek");
    if (btnPeek) btnPeek.onclick = peekAnswer;
  }

  updateMidStats();
  const act = document.querySelector(".q-pill.active");
  if (act) act.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
}

function pick(k) {
  const q = L[li].q[qi];
  if (userAnswers[qi]) return;
  const good = (k === q.a);
  userAnswers[qi] = { answered: true, selected: k, correct: good, peeked: false };
  if (!good && !wq.some(item => item === q)) {
    wq.push(q);
    try { navigator.vibrate && navigator.vibrate(40); } catch(x) {}
  }
  
  const bs = document.querySelectorAll(".opt");
  bs.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add("ok");
    else if (i === k) b.classList.add("bad");
  });
  
  const fb = document.getElementById("fb");
  if (fb) {
    fb.innerHTML = `<div class="fb ${good ? "ok" : "bad"}" role="status">${
      good ? "✓ إجابتك صح" : "✗ إجابتك غلط"
    }${good ? "" : "<em>Correct answer: " + esc(q.o[q.a]) + "</em>"}</div>`;
  }
  
  const btnPeek = document.getElementById("btn-peek");
  if (btnPeek) {
    btnPeek.disabled = true;
    btnPeek.textContent = "✓ تم إرسال الإجابة";
  }
  
  if (!RM && good) {
    const r = document.querySelector(".opt.ok")?.getBoundingClientRect();
    if (r) confetti(r.left + r.width / 2, r.top + r.height / 2, 26);
  }
  
  const stripPill = document.querySelector(`.q-pill[data-qi="${qi}"]`);
  if (stripPill) {
    stripPill.className = `q-pill active ${good ? "ok" : "bad"}`;
  }
  
  updateMidStats();
}

function peekAnswer() {
  const q = L[li].q[qi];
  if (userAnswers[qi]) return;
  userAnswers[qi] = { answered: true, selected: null, correct: false, peeked: true };
  if (!wq.some(item => item === q)) {
    wq.push(q);
  }
  
  const bs = document.querySelectorAll(".opt");
  bs.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add("ok");
  });
  
  const fb = document.getElementById("fb");
  if (fb) {
    fb.innerHTML = `<div class="fb ok" role="status">👁️ تم كشف الإجابة الصحيحة: <em>${esc(q.o[q.a])}</em></div>`;
  }
  
  const btnPeek = document.getElementById("btn-peek");
  if (btnPeek) {
    btnPeek.disabled = true;
    btnPeek.textContent = "👁️ تم كشف الإجابة";
  }
  
  const stripPill = document.querySelector(`.q-pill[data-qi="${qi}"]`);
  if (stripPill) {
    stripPill.className = "q-pill active peeked";
  }
  
  updateMidStats();
}

function navPrev() {
  if (qi > 0) {
    qi--;
    show();
  }
}

function navNext() {
  const n = L[li].q.length;
  if (qi < n - 1) {
    qi++;
    show();
  } else {
    if (L[li].essay) finishEssay();
    else finish();
  }
}

function finishEssay() {
  const n = L[li].q.length;
  best[li] = n;
  save();
  app.innerHTML = `<div class="res">
    <div>أتممت مراجعة</div>
    <div class="n" style="--p:100"><span>${n}/${n}</span></div>
    <p>🎉 أحسنت! راجعت جميع الأسئلة المقالية ونماذج إجاباتها بالتفصيل.</p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      <button class="btn" id="re">أعد المراجعة</button>
      <button class="btn alt" id="hm">كل الأقسام</button>
    </div>
  </div>`;
  document.getElementById("re").onclick = () => start(li);
  document.getElementById("hm").onclick = home;
  scrollTo(0, 0);
  if (!RM) {
    for (let i = 0; i < 4; i++) setTimeout(() => confetti(innerWidth * (.2 + i * .2), innerHeight * .3, 30), i * 250);
  }
}

function finish() {
  const l = L[li], n = l.q.length;
  const scoreVal = Object.values(userAnswers).filter(a => a && a.correct && !a.peeked).length;
  if (best[li] == null || scoreVal > best[li]) {
    best[li] = scoreVal;
    save();
  }
  const pct = Math.round((scoreVal / n) * 100);
  const wrongCount = n - scoreVal;
  
  const rk = pct >= 90 ? ["👑", "Root", "أسطورة السيرفرات"] :
             pct >= 75 ? ["🛡️", "Sudoer", "أدمن محترف"] :
             pct >= 50 ? ["🧑‍💻", "Admin Trainee", "أدمن تحت التدريب"] :
                         ["👤", "Guest", "راجع وهتوصل"];
                         
  app.innerHTML = `<div class="res">
    <div>نتيجتك في ${l.n}</div>
    <div class="rank">${rk[0]} <b>${rk[1]}</b><small>${rk[2]}</small></div>
    <div class="rings">
      <figure>
        <div class="n" style="--p:${pct}"><span>${scoreVal}/${n}</span></div>
        <figcaption>✅ صح</figcaption>
      </figure>
      <figure>
        <div class="n n2" style="--p:${Math.round((wrongCount / n) * 100)}"><span>${wrongCount}</span></div>
        <figcaption>❌ أخطاء أو تخطي</figcaption>
      </figure>
    </div>
    <p>${pct >= 80 ? "ممتاز! أنت متمكن من المحاضرة" : pct >= 50 ? "كويس، راجع الأسئلة الغلط تحت" : "محتاج تراجع المحاضرة وتحاول تاني"}</p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px;">
      <button class="btn" id="re">أعد الاختبار</button>
      ${wq.length ? `<button class="btn" id="rw">🔁 راجع الأخطاء فقط (${wq.length})</button>` : ""}
      <button class="btn alt" id="hm">كل المحاضرات</button>
    </div>
    <div class="rev">
      ${l.q.map((q, idx) => {
        const a = userAnswers[idx];
        const isGood = a && a.correct && !a.peeked;
        const isSkipped = !a || !a.answered;
        const isPeeked = a && a.peeked;
        const tag = isGood ? "✓ إجابة صحيحة" : isSkipped ? "⏭️ تم التخطي" : isPeeked ? "👁️ تم كشف الإجابة" : "✗ إجابة خاطئة";
        const cls = isGood ? "ok" : "bad";
        return `<div class="${cls}">
          <b>${idx + 1}. ${tag}</b>: ${esc(q.q)}
          ${isGood ? "" : `<br><em style="display:inline-block;margin-top:6px;color:var(--text-sec)">الإجابة الصحيحة: ${esc(q.o[q.a])}</em>`}
        </div>`;
      }).join("")}
    </div>
  </div>`;
  
  document.getElementById("re").onclick = () => start(li);
  document.getElementById("hm").onclick = home;
  const rw = document.getElementById("rw");
  if (rw && wq.length) {
    rw.onclick = () => {
      const qs = wq.slice();
      L.push({ n: "مراجعة الأخطاء", s: "Review Mistakes", q: qs });
      start(L.length - 1);
    };
  }
  scrollTo(0, 0);
  if (!RM && pct >= 80) {
    for (let i = 0; i < 4; i++) {
      setTimeout(() => confetti(innerWidth * (0.2 + i * 0.2), innerHeight * 0.3, 30), i * 250);
    }
  }
}

// Global Keyboard Arrow Navigation (RTL: ArrowRight = Previous, ArrowLeft = Next)
window.addEventListener("keydown", (e) => {
  if (li === undefined || !document.querySelector(".q")) return;
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  if (e.key === "ArrowRight") {
    e.preventDefault();
    navPrev();
  } else if (e.key === "ArrowLeft") {
    e.preventDefault();
    navNext();
  }
});

// Mobile Touch Swipe Navigation (RTL: swipe right = Previous, swipe left = Next)
let touchStartX = 0, touchStartY = 0;
window.addEventListener("touchstart", (e) => {
  if (e.touches && e.touches.length === 1) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }
}, { passive: true });

window.addEventListener("touchend", (e) => {
  if (!touchStartX || !e.changedTouches || e.changedTouches.length === 0) return;
  if (li === undefined || !document.querySelector(".q")) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  touchStartX = 0;
  touchStartY = 0;
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.4) {
    if (dx > 0) {
      navPrev();
    } else {
      navNext();
    }
  }
}, { passive: true });

// Initial render
home();

// Theme Toggle Engine
(function() {
  const tgl = document.getElementById("tgl");
  if (tgl) {
    tgl.onclick = () => {
      const cur = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", cur);
      try { localStorage.setItem("sa_theme", cur); } catch(e){}
    };
  }
})();

</script>
</body>
</html>
